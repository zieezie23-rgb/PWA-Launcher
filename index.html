<style>
*{box-sizing:border-box}
html{overscroll-behavior-y:contain;height:100%;overflow:hidden;background:#15120d}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-family:'Special Elite',cursive;background:#15120d radial-gradient(ellipse at top, #221c14 0%, #0b0906 75%),url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxODAnIGhlaWdodD0nMTgwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC43JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdHlwZT0nbWF0cml4JyB2YWx1ZXM9JzAgMCAwIDAgMC42ICAwIDAgMCAwIDAuNDUgIDAgMCAwIDAgMC4zICAwIDAgMCAwLjA2IDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=);background-blend-mode:normal,overlay;background-size:auto,190px 190px;background-repeat:no-repeat,repeat;color:#d9cfc0;background-attachment:fixed;overscroll-behavior-y:contain}
header{background:linear-gradient(160deg,#2a2318,#3d2e1a 60%,#1a1610);color:#e8b23d;padding:26px 18px 22px;border-top:8px solid;border-image:repeating-linear-gradient(45deg,#e8b23d 0 14px,#1a1610 14px 28px) 8;border-bottom:8px solid;border-image:repeating-linear-gradient(45deg,#e8b23d 0 14px,#1a1610 14px 28px) 8;box-shadow:0 8px 30px #000c;text-align:center}
header h1{margin:0;font-family:'Special Elite',cursive;font-size:34px;letter-spacing:3px;color:#e8b23d;text-shadow:2px 2px 0 #000,0 0 14px #00000088}
header .sub{font-family:'Special Elite',cursive;font-size:13px;color:#a99a80;margin-top:8px;letter-spacing:.5px}

.panel{background:linear-gradient(160deg,#2a2318,#1a1610);border:1px solid #5a4c34;border-radius:4px;padding:16px;box-shadow:inset 0 0 25px #0009, 0 4px 18px #000a;margin-bottom:16px}
h2{margin:0 0 5px;font-family:'Special Elite',cursive;font-size:20px;letter-spacing:1px;color:#e8b23d}
label{display:block;font-family:'Special Elite',cursive;font-weight:500;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#c9a86a;margin:10px 0 6px}
input{width:100%;padding:12px;background:#100e0a;border:1px solid #5a4c34;border-radius:3px;font-size:15px;color:#e2d8c8;font-family:'Special Elite',cursive}
input::placeholder{color:#6b6152}

button{border:0;border-radius:3px;padding:11px 14px;font-weight:700;cursor:pointer;font-family:'Special Elite',cursive;text-transform:uppercase;letter-spacing:1px;font-size:13px}
.primary{background:linear-gradient(160deg,#e8b23d,#a5701f);color:#221a0e;box-shadow:0 0 12px #e8b23d55;border:1px solid #f0c14b}
.light{background:#302819;color:#c9a86a;border:1px solid #5a4c34}
.dark{background:#0b0906;color:#8a8175;border:1px solid #3a332a}
.danger{background:#3a1408;color:#e87c4a;border:1px solid #c9622f}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.account{display:flex;justify-content:space-between;align-items:center;gap:10px}
.icon-only{background:none;border:none;padding:4px;color:#e8b23d;display:flex;align-items:center;cursor:pointer;flex:none}
.icon-only:hover{color:#f0c14b}
.email{font-family:'Special Elite',cursive;letter-spacing:1px;font-size:18px;color:#e8b23d;text-shadow:0 0 6px #00000088;overflow:hidden;text-overflow:ellipsis}
.muted{color:#a99a80;font-size:12px;line-height:1.6;font-family:'Special Elite',cursive}
.status{min-height:18px;font-size:13px;margin-top:8px;font-family:'Special Elite',cursive;color:#e87c4a}
.section-title{display:flex;align-items:center;gap:12px;margin:12px 0 10px}
.section-title.spread{justify-content:space-between}
.section-title .txt{font-family:'Special Elite',cursive;font-size:21px;letter-spacing:2px;color:#e8b23d;text-shadow:0 0 8px #00000066}
.section-title .left{display:flex;align-items:center;gap:12px}
.search-icon-btn{background:none;border:none;color:#c9a86a;font-size:22px;padding:4px 6px;line-height:1;cursor:pointer}
.search-icon-btn:hover{color:#e8b23d}
.divider{border:none;border-top:2px dashed #5a4c34;margin:10px 0;opacity:.7}
.empty{text-align:center;color:#a99a80;padding:30px;font-family:'Special Elite',cursive}
.hidden{display:none!important}

/* Popup tambah / edit aplikasi */
#addModal{position:fixed;inset:0;z-index:50;background:#000000cc;display:none;align-items:center;justify-content:center;padding:16px}
#addModal.show{display:flex}
.modal{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:linear-gradient(160deg,#2a2318,#1a1610);border:1px solid #5a4c34;border-radius:4px;padding:18px;box-shadow:0 10px 40px #000}
.modal h2{font-size:18px;margin:0 0 4px}
#cancelBtn{width:100%;margin-top:8px}
.tools{display:flex;align-items:center;gap:6px}
#addOpenBtn{font-size:30px;font-weight:700;padding:0 8px}

/* Koleksi - grid & kartu (2 kolom tetap) */
#searchWrap{display:none;margin-bottom:10px}
#searchWrap.show{display:block}
#listPanel{width:100%}
#searchWrap{margin-bottom:10px}
.grid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px;align-items:stretch;overflow:visible;padding:0 0 8px}
.grid>.card{min-width:0;min-height:190px}
.grid>.empty{grid-column:1 / -1}
.card{position:relative;background:linear-gradient(160deg,#2a2318,#1a1610);border:1px solid #5a4c34;border-radius:4px;box-shadow:inset 0 0 25px #0009, 0 4px 18px #000a;padding:14px 10px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.icon{width:clamp(96px,13vw,130px);height:clamp(96px,13vw,130px);object-fit:contain;background:none;border:none;box-shadow:none;flex:none;cursor:pointer;transition:transform .15s}
.icon:hover{transform:scale(1.06)}
.name{font-family:'Special Elite',cursive;font-weight:400;font-size:clamp(13px,1.6vw,14px);line-height:1.35;color:#e2d8c8;width:100%;min-width:0;text-align:center;padding:0 18px 0 4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.card.drag-over{border-color:#e8b23d;box-shadow:0 0 0 2px #e8b23d55,inset 0 0 25px #0009}
.card{cursor:grab;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.icon{-webkit-user-drag:none;-webkit-touch-callout:none}
.card:active{cursor:grabbing}
.card.dragging{opacity:.5;transform:scale(1.03);z-index:5}
.menu-wrap{position:absolute;right:0;bottom:0}
.dots{background:none;border:none;color:#8a8175;font-size:20px;line-height:1;padding:4px 10px;letter-spacing:1px}
.dots:hover{color:#e8b23d}
.dropdown{position:fixed;top:0;left:0;background:#1a1610;border:1px solid #5a4c34;border-radius:3px;box-shadow:0 8px 24px #000d;display:none;flex-direction:column;overflow:hidden;min-width:140px;z-index:10}
.dropdown.show{display:flex}
.dropdown button{border-radius:0;text-align:left;padding:10px 14px;background:transparent;color:#d9cfc0;font-family:'Special Elite',cursive;font-weight:600;font-size:13px;text-transform:none;letter-spacing:0}
.dropdown button:hover{background:#302819}
.dropdown button.danger-item{color:#e87c4a}
::selection{background:#e8b23d;color:#221a0e}
#accessModal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
#accessModal.show{display:flex}
.access-box{width:min(420px,100%);background:#1a1610;border:1px solid #6b5735;border-radius:12px;box-shadow:0 18px 60px #000e;padding:22px;color:#eee5d7}
.access-box h2{margin:0 0 10px;color:#e8b23d;font-size:22px}

.access-box .row{display:flex;gap:10px;margin-top:14px}
#authTitle{cursor:pointer}
#signup{display:none}
#signup.revealed{display:inline-flex}

</style>

<body>

<script type="module">
/* 1) Buat project Supabase.
   2) Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bawah.
   3) Jalankan SQL yang ada di supabase.sql.
*/
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://tkovoanimdzjsfcpvguf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yO7XRTLUT_5eejm3Smr0mA_Oxx-DQyl";
const configured = !SUPABASE_URL.startsWith("GANTI_") && !SUPABASE_ANON_KEY.startsWith("GANTI_");
const supabase = configured ? createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;

const $=id=>document.getElementById(id);
const DUMMY_DOMAIN="pwahub.local"; // username diubah jadi "username@pwahub.local" supaya Supabase Auth tetap jalan tanpa email asli
function toEmail(u){return u.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,"")+"@"+DUMMY_DOMAIN}
function msg(el,text){el.textContent=text}
function fallback(name){return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><text x="96" y="140" text-anchor="middle" font-size="120">📦</text></svg>`)}
function valid(u){try{return new URL(u).href}catch{return ""}}
async function manifestIcon(appUrl,name){
 try{let u=new URL(appUrl);
   // Coba /manifest.json dulu, lalu cari <link rel=manifest> di HTML halamannya.
   let r=await fetch(new URL("/manifest.json",u.origin),{mode:"cors",cache:"no-store"});
   if(!r.ok){let h=await fetch(appUrl,{mode:"cors",cache:"no-store"});let t=await h.text();let m=t.match(/<link[^>]+rel=["'](?:manifest|webmanifest)["'][^>]+href=["']([^"']+)["']/i);if(!m)throw 0;r=await fetch(new URL(m[1],appUrl),{mode:"cors",cache:"no-store"})}
   let j=await r.json();let icons=j.icons||[];if(!icons.length)throw 0;
   let b=icons.find(x=>String(x.sizes||"").includes("512x512"))||icons.find(x=>String(x.sizes||"").includes("192x192"))||icons[0];
   return new URL(b.src,r.url||appUrl).href;
 }catch{return fallback(name)}
}
// Menu ••• memakai posisi fixed (tidak terpotong grid), dibuka ke atas tombol bila muat.
function placeDropdown(btn,dd){
 const r=btn.getBoundingClientRect(),w=dd.offsetWidth,h=dd.offsetHeight;
 let top=r.top-h-4;if(top<8)top=r.bottom+4;
 const left=Math.min(Math.max(8,r.right-w),innerWidth-w-8);
 dd.style.top=top+"px";dd.style.left=left+"px";
}
function closeMenus(){document.querySelectorAll(".dropdown.show").forEach(d=>d.classList.remove("show"))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

let editingId=null;

function resetAddForm(){
 editingId=null;
 $("name").value=$("url").value=$("repo").value="";
 $("add").textContent="📦 Simpan";
 $("modalTitle").textContent="📦 Simpan Barang Baru";
 msg($("addStatus"),"");
}
function openAdd(){
 $("addModal").classList.add("show");
 document.body.style.overflow="hidden";
 $("name").focus();
}
function closeAdd(){
 $("addModal").classList.remove("show");
 document.body.style.overflow="";
 resetAddForm();
}

async function refresh(){
 if(!supabase)return;
 const {data:{user}}=await supabase.auth.getUser();
 const logged=!!user;
 $("auth").classList.toggle("hidden",logged);
 $("authTitle").classList.toggle("hidden",logged);
 $("accountPanel").classList.toggle("hidden",!logged);
 $("listDivider").classList.toggle("hidden",!logged);
 $("listTitle").classList.toggle("hidden",!logged);
 $("listPanel").classList.toggle("hidden",!logged);
 if(!logged){closeAdd();return}
 $("userEmail").textContent="🔦 Selamat datang, "+(user.user_metadata?.username||user.email.split("@")[0]);
 const {data,error}=await supabase.from("apps").select("*").order("sort_order",{ascending:true}).order("created_at",{ascending:true});
 if(error){$("grid").innerHTML=`<div class="panel empty">Gagal mengambil data: ${escapeHtml(error.message)}</div>`;return}
 const q=$("search").value.toLowerCase().trim();const list=(data||[]).filter(a=>(a.name+" "+a.url).toLowerCase().includes(q));
 $("grid").innerHTML=list.length?list.map(a=>`<article class="card" data-id="${a.id}">
  <div class="menu-wrap">
   <button class="dots" data-menu="${a.id}">•••</button>
   <div class="dropdown">
    <button data-edit="${a.id}">✏️ Edit</button>
    <button data-repo="${a.id}">🔗 Repo</button>
    <button class="danger-item" data-delete="${a.id}">🗑️ Buang</button>
   </div>
  </div>
  <img class="icon" draggable="false" src="${escapeHtml(a.icon_url||fallback(a.name))}" onerror="this.onerror=null;this.src='${fallback(a.name)}'" data-open="${a.id}">
  <div class="name">${escapeHtml(a.name)}</div>
 </article>`).join(""):`<div class="panel empty">Belum ada aplikasi.</div>`;

 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{let a=data.find(x=>x.id==b.dataset.open);window.open(a.url,"_blank","noopener")});
 setupDragReorder(data||[]);
 document.querySelectorAll("[data-repo]").forEach(b=>b.onclick=(e)=>{e.stopPropagation();let a=data.find(x=>x.id==b.dataset.repo);window.open(a.repo_url,"_blank","noopener")});
 document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async(e)=>{e.stopPropagation();if(confirm("Musnahkan aplikasi ini selamanya?")){await supabase.from("apps").delete().eq("id",b.dataset.delete);refresh()}});
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=(e)=>{
  e.stopPropagation();
  let a=data.find(x=>x.id==b.dataset.edit);
  editingId=a.id;
  $("name").value=a.name; $("url").value=a.url; $("repo").value=a.repo_url;
  $("add").textContent="📦 Simpan Perubahan";
  $("modalTitle").textContent="✏️ Edit Aplikasi";
  openAdd();
 });
 document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=(e)=>{
  e.stopPropagation();
  const dd=b.nextElementSibling;
  document.querySelectorAll(".dropdown.show").forEach(d=>{if(d!==dd)d.classList.remove("show")});
  dd.classList.toggle("show");
  if(dd.classList.contains("show"))placeDropdown(b,dd);
 });
}

let dragSrcId=null,dragList=[],dragActive=false,dragOverId=null,longPressTimer=null,pStartX=0,pStartY=0;
const LONG_PRESS_MS=250,MOVE_CANCEL_PX=10;

function setupDragReorder(list){
 dragList=list;
 document.querySelectorAll(".card").forEach(card=>{
  card.onpointerdown=(e)=>{
   if(e.target.closest("button,.dropdown,a"))return;
   dragSrcId=card.dataset.id;dragActive=false;dragOverId=null;
   pStartX=e.clientX;pStartY=e.clientY;
   clearTimeout(longPressTimer);
   longPressTimer=setTimeout(()=>{
    dragActive=true;
    card.classList.add("dragging");
    if(navigator.vibrate)navigator.vibrate(15);
    startAutoScroll();
   },LONG_PRESS_MS);
  };
 });
}

let dragX=0,dragY=0,dragMoved=false,autoRaf=0;
const EDGE_PX=56,MAX_SPEED=16;
function updateDragOver(){
 const el=document.elementFromPoint(dragX,dragY);
 const overCard=el&&el.closest(".card");
 document.querySelectorAll(".card.drag-over").forEach(c=>c.classList.remove("drag-over"));
 if(overCard&&overCard.dataset.id!==dragSrcId){
  dragOverId=overCard.dataset.id;
  overCard.classList.add("drag-over");
 }else{
  dragOverId=null;
 }
}
// Auto-scroll vertikal saat kartu diseret ke tepi atas/bawah area daftar.
function autoScrollTick(){
 autoRaf=0;
 if(!dragActive)return;
 if(dragMoved){
  const g=$("grid"),r=g.getBoundingClientRect(),scroller=document.querySelector("main"),sr=scroller.getBoundingClientRect();
  let v=0;
  if(dragY<sr.top+EDGE_PX)v=-MAX_SPEED*Math.min(1,(sr.top+EDGE_PX-dragY)/EDGE_PX);
  else if(dragY>sr.bottom-EDGE_PX)v=MAX_SPEED*Math.min(1,(dragY-(sr.bottom-EDGE_PX))/EDGE_PX);
  if(v){const before=scroller.scrollTop;scroller.scrollTop+=v;if(scroller.scrollTop!==before)updateDragOver()}
 }
 autoRaf=requestAnimationFrame(autoScrollTick);
}
function startAutoScroll(){
 dragX=pStartX;dragY=pStartY;dragMoved=false;
 if(!autoRaf)autoRaf=requestAnimationFrame(autoScrollTick);
}
function stopAutoScroll(){
 if(autoRaf){cancelAnimationFrame(autoRaf);autoRaf=0}
 dragMoved=false;
}

document.addEventListener("pointermove",(e)=>{
 if(!dragSrcId)return;
 if(!dragActive){
  if(Math.abs(e.clientX-pStartX)>MOVE_CANCEL_PX||Math.abs(e.clientY-pStartY)>MOVE_CANCEL_PX){
   clearTimeout(longPressTimer);dragSrcId=null;
  }
  return;
 }
 e.preventDefault();
 dragX=e.clientX;dragY=e.clientY;dragMoved=true;
 updateDragOver();
},{passive:false});

document.addEventListener("pointerup",async()=>{
 clearTimeout(longPressTimer);
 stopAutoScroll();
 document.querySelectorAll(".card.dragging").forEach(c=>c.classList.remove("dragging"));
 document.querySelectorAll(".card.drag-over").forEach(c=>c.classList.remove("drag-over"));
 if(dragActive&&dragSrcId&&dragOverId&&dragOverId!==dragSrcId){
  const from=dragList.findIndex(a=>a.id==dragSrcId),to=dragList.findIndex(a=>a.id==dragOverId);
  if(from>=0&&to>=0){
   // Tukar posisi: kartu yang diseret dan kartu tujuan saling bertukar tempat.
   const reordered=dragList.slice();
   [reordered[from],reordered[to]]=[reordered[to],reordered[from]];
   // Nomori ulang 0..n-1, tapi hanya kirim baris yang nomornya berubah.
   await Promise.all(reordered.map((a,i)=>a.sort_order===i?null:supabase.from("apps").update({sort_order:i}).eq("id",a.id)));
   refresh();
  }
 }
 dragSrcId=null;dragActive=false;dragOverId=null;
});

document.addEventListener("pointercancel",()=>{
 clearTimeout(longPressTimer);
 stopAutoScroll();
 document.querySelectorAll(".card.dragging").forEach(c=>c.classList.remove("dragging"));
 document.querySelectorAll(".card.drag-over").forEach(c=>c.classList.remove("drag-over"));
 dragSrcId=null;dragActive=false;dragOverId=null;
});

document.addEventListener("touchmove",(e)=>{if(dragActive&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",(e)=>{if(dragSrcId&&e.target.closest(".card"))e.preventDefault()});

document.querySelector("main").addEventListener("scroll",closeMenus,{passive:true});
addEventListener("resize",closeMenus);
document.addEventListener("click",function(e){
 if(!e.target.closest(".menu-wrap")){
  document.querySelectorAll(".dropdown.show").forEach(d=>d.classList.remove("show"));
 }
});

$("addOpenBtn").onclick=()=>{resetAddForm();openAdd()};
$("cancelBtn").onclick=closeAdd;
$("addModal").addEventListener("pointerdown",e=>{if(e.target===$("addModal"))closeAdd()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("addModal").classList.contains("show"))closeAdd()});
$("searchToggle").onclick=()=>{
 $("searchWrap").classList.toggle("show");
 if($("searchWrap").classList.contains("show"))$("search").focus();
};

let accessUnlocked=false;
let loginPressTimer=null;

function openAccess(){
 $("accessCode").value="";
 msg($("accessStatus"),"");
 $("accessModal").classList.add("show");
 setTimeout(()=>$("accessCode").focus(),80);
}
function closeAccess(){ $("accessModal").classList.remove("show"); }

$("siteTitle").addEventListener("click",openAccess);
$("siteTitle").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openAccess()}});
$("accessCancel").onclick=closeAccess;
$("accessModal").addEventListener("pointerdown",e=>{if(e.target===$("accessModal"))closeAccess()});
$("accessConfirm").onclick=()=>{
 if($("accessCode").value!=="00000") return msg($("accessStatus"),"Kode akses salah.");
 accessUnlocked=true;
 closeAccess();
 msg($("authStatus"),"Akses diterima. Silakan masuk.");
};
$("accessCode").addEventListener("keydown",e=>{if(e.key==="Enter")$("accessConfirm").click()});

function startLoginLongPress(){
 clearTimeout(loginPressTimer);
 loginPressTimer=setTimeout(()=>{
  $("signup").classList.add("revealed");
  msg($("authStatus"),"Tombol Daftar dibuka.");
 },3000);
}
function cancelLoginLongPress(){clearTimeout(loginPressTimer);}
$("login").addEventListener("pointerdown",startLoginLongPress);
$("login").addEventListener("pointerup",cancelLoginLongPress);
$("login").addEventListener("pointerleave",cancelLoginLongPress);
$("login").addEventListener("pointercancel",cancelLoginLongPress);

$("signup").onclick=async()=>{
 if(!supabase)return msg($("authStatus"),"Isi konfigurasi Supabase terlebih dahulu.");
 let uname=$("username").value.trim();
 if(uname.length<3)return msg($("authStatus"),"Username minimal 3 karakter.");
 let {error}=await supabase.auth.signUp({email:toEmail(uname),password:$("password").value,options:{data:{username:uname}}});
 msg($("authStatus"),error?(error.message.includes("registered")?"Username sudah dipakai.":error.message):"Pendaftaran berhasil. Silakan masuk.")
};
$("login").onclick=async()=>{
 if(!supabase)return msg($("authStatus"),"Isi konfigurasi Supabase terlebih dahulu.");
 let uname=$("username").value.trim();
 let {error}=await supabase.auth.signInWithPassword({email:toEmail(uname),password:$("password").value});
 msg($("authStatus"),error?"Username atau password salah.":"Berhasil masuk.");if(!error)refresh()
};
$("logout").onclick=async()=>{await supabase.auth.signOut();refresh()};
$("add").onclick=async()=>{
 if(!supabase)return;
 let name=$("name").value.trim(),url=valid($("url").value.trim()),repo=valid($("repo").value.trim());
 if(!name||!url||!repo)return msg($("addStatus"),"Lengkapi semua kolom.");
 msg($("addStatus"),"Membaca icon...");
 let icon=await manifestIcon(url,name);
 let {data:{user}}=await supabase.auth.getUser();
 let error;
 if(editingId){
  ({error}=await supabase.from("apps").update({name,url,repo_url:repo,icon_url:icon}).eq("id",editingId));
 }else{
  let {count}=await supabase.from("apps").select("id",{count:"exact",head:true});
  ({error}=await supabase.from("apps").insert({user_id:user.id,name,url,repo_url:repo,icon_url:icon,sort_order:count||0}));
 }
 msg($("addStatus"),error?error.message:(editingId?"Perubahan disimpan.":"Aplikasi berhasil ditambahkan."));
 if(!error){closeAdd();refresh()}
};
$("search").oninput=refresh;
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(configured){supabase.auth.onAuthStateChange(()=>refresh());refresh()}else{
 $("authStatus").textContent="Supabase belum dikonfigurasi. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di index.html.";
}
</script>
</body></html>
