<style>
:root{
  --blue:#0054A6; --blue-d:#003F7D; --blue-l:#E8F0FA; --red:#E31E24; --yellow:#FFC20E; --yellow-l:#FFF6D6;
  --bg:#EEF3FA; --panel:#FFFFFF; --panel2:#F6F9FE; --line:#D9E2EF; --text:#14213D; --muted:#5B6B82;
}
*{box-sizing:border-box}
html,body{height:100%; min-height:100%}
body{margin:0; min-height:100dvh; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; flex-direction:column; overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums}
header{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--blue); color:#fff;
  padding:14px 22px 17px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
header::after{content:""; position:absolute; left:0; right:0; bottom:0; height:5px; z-index:1; background:linear-gradient(90deg,var(--red) 0 34%,var(--yellow) 34% 68%,var(--red) 68% 100%)}
.header-title-wrap{display:flex; align-items:center; gap:12px}
.header-logo{height:60px; width:auto; flex:none; object-fit:contain; border-radius:10px}
.header-title-col{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:4px}
header h1{font-size:17px; font-weight:800; margin:0; letter-spacing:.2px}
.header-period{display:block; margin-top:0; background:transparent; color:#fff; border:1px solid rgba(255,255,255,.42); border-radius:6px; padding:4px 8px; font-family:inherit; font-size:12px; min-width:150px}
.header-period{outline:none; border:0 !important; box-shadow:none; background:transparent; padding-left:0; padding-right:18px; cursor:pointer}.header-period:focus,.header-period:focus-visible{outline:none; box-shadow:none}.header-period option{color:var(--text); background:#fff}
header .sub{font-size:12px; margin-top:5px; min-height:16px}
.sync-ok{color:#7CFC98 !important}
.sync-loading{color:#FFD54A !important; animation:syncBlink 1s ease-in-out infinite}
.sync-offline,.sync-error{color:#FF6B6B !important}
.sync-unconfigured{color:#fff !important}
.sync-error{display:flex; align-items:center; gap:5px}
.warn-icon{width:14px; height:14px; flex:none; fill:currentColor}
@keyframes syncBlink{50%{opacity:.35}}
.header-actions{position:relative; display:flex; flex-direction:column; align-items:flex-end; gap:3px; min-width:170px}
.gear-btn{appearance:none; border:0; background:none; color:#fff; padding:0; margin:0; width:38px; height:38px; display:grid; place-items:center; cursor:pointer; opacity:.95}
.gear-btn:hover{opacity:.7}
.gear-btn svg{width:32px;height:32px;fill:currentColor}
.action-menu{position:absolute; right:0; top:28px; z-index:20; display:none; min-width:155px; padding:6px; background:#fff; border:1px solid var(--line); border-radius:9px; box-shadow:0 8px 24px rgba(0,0,0,.18)}
.action-menu.open{display:flex; flex-direction:column; gap:3px}
.action-menu .btn{width:100%; text-align:left; padding:8px 10px; border-radius:6px}
.action-menu .btn.ghost{color:var(--text); border:0; background:transparent}
.action-menu .btn.ghost:hover{background:var(--blue-l)}
.action-menu .btn.danger{color:var(--red)}
.action-menu .btn.danger:hover{background:#FDEAEA}
.action-menu .btn .warn-outline{width:14px; height:14px; vertical-align:-2px; margin-right:5px; fill:none; stroke:var(--red); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.btn{background:var(--red); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; transition:background .15s, transform .1s}
.btn:hover{background:#C8161C}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.55)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
main{width:100%; max-width:none; flex:1 0 auto; margin:0 auto; padding:22px 20px 60px}
.empty{border:2px dashed #9DB9DE; background:var(--panel); border-radius:14px; padding:56px 24px; text-align:center; margin-top:40px}
.empty h2{font-size:19px; margin:0 0 8px; color:var(--blue)}
.empty p{color:var(--muted); font-size:14px; max-width:420px; margin:0 auto 22px; line-height:1.6}
#hidden-input{display:none}
.hidden{display:none !important}

.layout{display:grid; grid-template-columns:280px minmax(0,1fr); gap:18px; align-items:start}
.content{min-width:0}
.side{position:sticky; top:calc(env(safe-area-inset-top,0px) + 84px); max-height:calc(100vh - 110px); overflow-y:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(0,84,166,.08)}
.side h3{font-size:13px; margin:0 0 10px; color:var(--blue); text-transform:uppercase; letter-spacing:.06em}
.per{color:var(--muted); font-size:12px}
.side .per{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.per select{background:#fff; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-family:inherit; font-size:12px}
.side details{background:none; border:0; border-top:1px solid var(--line); border-radius:0; padding:0; margin:0}
.side summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; padding:10px 6px; margin:0 -6px; border-radius:8px; font-size:12.5px; font-weight:800; color:var(--blue-d); letter-spacing:.03em; transition:background .15s, color .15s}
.side summary:hover{background:var(--blue-l); color:var(--blue-d)}
.side summary::-webkit-details-marker{display:none}
.side summary::after{content:""; flex:none; width:10px; height:10px; margin:0 6px 4px 0; border-right:3px solid var(--blue); border-bottom:3px solid var(--blue); transform:rotate(45deg); transition:transform .15s}
.side details:not([open]) summary::after{transform:rotate(-45deg); margin:0 8px 0 0}
.side summary.sel{color:var(--red)}
.sub-list{display:flex; flex-direction:column; gap:3px; padding:0 0 9px 6px}
.sub-choice{width:100%; text-align:left; border:1px solid transparent; background:transparent; color:var(--text); border-radius:8px; padding:8px 10px; font-size:12.5px; line-height:1.35; cursor:pointer; font-family:inherit; transition:background .15s, color .15s, transform .1s}
.sub-choice:hover{background:var(--blue-l)}
.sub-choice:active{transform:scale(.98)}
.sub-choice.active{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; box-shadow:inset 4px 0 0 var(--yellow)}
.sub-choice.active:hover{background:var(--blue)}
.side .flat{border-top:1px solid var(--line); padding:6px 0 4px}
.side .flat.first{border-top:0; padding-top:0}
.side .flat .sub-choice{font-weight:800; font-size:12.5px; padding:9px 10px; color:var(--blue-d)}
.side .flat .sub-choice.active{color:#fff}
/* Dashboard dibuat berbeda agar menjadi tombol utama navigasi */
.side .dashboard-flat{border-top:0; padding:0 0 10px; margin-bottom:6px}
.side .dashboard-choice{position:relative; overflow:hidden; background:linear-gradient(135deg,#0054A6 0%,#0077C8 100%); color:#fff !important; border:0; border-radius:10px; padding:11px 12px; font-size:12.5px; font-weight:800; letter-spacing:.03em; box-shadow:0 4px 10px rgba(0,84,166,.20); transition:transform .15s, box-shadow .15s, filter .15s}
.side .dashboard-choice::before{content:"▦"; display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; margin-right:8px; border-radius:6px; background:rgba(255,255,255,.18); font-size:14px; vertical-align:-5px}
.side .dashboard-choice::after{content:""; position:absolute; right:-18px; top:-22px; width:62px; height:62px; border-radius:50%; background:rgba(255,194,14,.22)}
.side .dashboard-choice:hover{background:linear-gradient(135deg,#00478D 0%,#0069B5 100%); filter:brightness(1.04); box-shadow:0 6px 14px rgba(0,84,166,.25); transform:translateY(-1px)}
.side .dashboard-choice.active{background:linear-gradient(135deg,#003F7D 0%,#005FAE 100%); box-shadow:0 5px 14px rgba(0,63,125,.28), inset 0 -3px 0 var(--yellow)}

.vt{font-size:16px; margin:0 0 12px; font-weight:800; color:var(--blue-d); padding-left:10px; border-left:5px solid var(--red)}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin-bottom:14px}
.kpi{background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--blue); border-radius:8px; padding:11px 13px; box-shadow:0 1px 3px rgba(0,84,166,.06)}
.kpi:nth-child(3n+2){border-top-color:var(--red)} .kpi:nth-child(3n){border-top-color:var(--yellow)}
.kpi .l{color:var(--muted); font-size:10.5px; margin-bottom:5px; display:inline-block; background:var(--blue-l); padding:3px 8px; border-radius:5px}
.kpi .v{font-size:16px; font-weight:800; color:var(--blue-d)}
.kpi .v.amber{color:var(--red)} .kpi .v.teal{color:var(--blue)}
.kpi.multi .l{margin-bottom:6px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:10.5px}
.kpi-sub{display:flex; justify-content:space-between; align-items:baseline; gap:14px; font-size:12px; padding:5px 0; border-top:1px dashed var(--line)}
.kpi-sub:first-of-type{border-top:0}
.kpi-sub .k{color:var(--muted); white-space:nowrap}
.kpi-sub .v{font-weight:800; color:var(--blue-d); font-size:12.5px; white-space:nowrap}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 16px 12px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,84,166,.06)}
.panel h3{font-size:14px; margin:0 0 3px; font-weight:800; color:var(--blue-d)}
.legend{display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-bottom:12px; flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:5px}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block}
.note{color:var(--muted); font-size:13px; padding:14px 4px}

.tbl-wrap{overflow:auto; max-height:420px; border:1px solid var(--line); border-radius:10px}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; white-space:nowrap}
thead th{position:sticky; top:0; z-index:2; background:var(--blue); color:#fff; text-align:center; vertical-align:middle;
  padding:10px 14px; min-width:96px; font-size:11.5px; font-weight:700; letter-spacing:.02em; border-right:1px solid rgba(255,255,255,.2)}
thead th:last-child{border-right:0}
thead th:first-child{left:0; z-index:4}
td{padding:8px 14px; text-align:right; border-bottom:1px solid var(--line); background:#fff}
tbody tr:nth-child(even) td{background:var(--panel2)}
tbody tr:hover td{background:var(--yellow-l)}
td:first-child,td:nth-child(2){text-align:center}
td:first-child{position:sticky; left:0; z-index:1; font-weight:600; color:var(--blue-d); border-right:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}

.gl{color:var(--muted); font-size:11.5px; font-weight:700; margin:12px 0 6px}
.chart-wrap{position:relative; height:275px; overflow-x:auto}
.cw{position:relative; height:255px; min-width:100%}
.cw canvas{min-width:600px}
.tabs{display:flex; overflow-x:auto; margin:2px 0 0}
.tabs::after{content:""; flex:1; min-width:8px; border-bottom:2px solid var(--blue)}
.tab{flex:none; background:var(--blue-l); color:var(--blue-d); border:2px solid var(--line); border-bottom:2px solid var(--blue); border-radius:9px 9px 0 0; margin-right:3px; padding:8px 16px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .15s}
.tab:hover{background:#D5E5F7}
.tab.on{background:#fff; border-color:var(--blue); border-bottom-color:#fff; font-weight:800; box-shadow:inset 0 4px 0 var(--yellow)}
.tab.on:hover{background:#fff}
.tab-body{border:2px solid var(--blue); border-top:0; border-radius:0 0 10px 10px; padding:14px 12px 8px; overflow-x:auto}
details.cd{border-top:1px solid var(--line); margin-top:10px}
details.cd summary{cursor:pointer; padding:10px 0 10px 6px; margin:0 0 0 -6px; border-radius:6px; font-size:12.5px; font-weight:700; color:var(--blue); list-style:none; transition:background .15s}
details.cd summary:hover{background:var(--blue-l)}
details.cd summary::-webkit-details-marker{display:none}
details.cd summary::before{content:"▸ "; font-size:10px}
details.cd[open] summary::before{content:"▾ "; font-size:10px}
footer{text-align:center; color:rgba(91,107,130,.65); background:transparent; font-size:5px; line-height:1.2; padding:5px 4px 6px; margin-top:auto; width:100%; flex:none}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{position:static; max-height:320px}}
.summary-row td{font-weight:700;background:#f4f7fb;border-top:2px solid #9aa8b8}
.src-tabs{display:flex; gap:6px; margin:0 0 12px; padding-bottom:12px; border-bottom:1px solid var(--line)}
.src-tab{flex:1; background:var(--panel2); color:var(--blue-d); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-weight:800; font-size:12.5px; letter-spacing:.02em; cursor:pointer; font-family:inherit; text-align:center; transition:background .15s, color .15s}
.src-tab:hover{background:var(--blue-l)}
.src-tab.active{background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 3px 8px rgba(0,84,166,.22)}
</style>
</head>

<script>
const $ = s => document.querySelector(s);

// ================================================================
// GOOGLE SHEETS DATABASE
// Setelah membuat Web App Apps Script, tempel URL /exec di bawah.
// Contoh: https://script.google.com/macros/s/AKfycb.../exec
// ================================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkx-qIN_Yt-5Fv2jv72MBAohKEGmAD-mxkbzXoZ0Gs02MBchMc5HBZTLgtCEa7Jedq/exec';
const USE_GOOGLE_SHEETS = /^https:\/\/script\.google\.com\/macros\/s\//.test(APPS_SCRIPT_URL);
const IDR = n => n==null?'-':new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(n);
const fmtDate = d => d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});
const fmtMonthKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthLabel = d => d.toLocaleDateString('id-ID',{month:'short',year:'2-digit'});
// Kunci bulan (YYYY-MM) terbaru dari sekumpulan baris data; 'ALL' kalau kosong.
const latestMonthKey = rows => {
  if(!rows || !rows.length) return 'ALL';
  return rows.reduce((max,r)=>{ const k=fmtMonthKey(r.date); return (!max || k>max) ? k : max; }, null);
};

let allRows = [];
let activeMonth = 'ALL';
let charts = {};
// Tab sumber data: 'induk' = file Produktivitas+Laporan Harian Nasional (asli),
// 'depo' = file Laporan Harian Depo (struktur sama, tanpa sheet Produktivitas).
let currentTab = 'induk';
let hRowsDepo = [];
const HKEY_DEPO = 'prod_dashboard_harian_depo_v1';
function saveHDepo(rows){ try{ localStorage.setItem(HKEY_DEPO, JSON.stringify(rows.map(r=>({...r,date:r.date.toISOString()})))); }catch(e){ console.warn('Storage gagal', e); } }
function loadHDepo(){ try{ const raw=localStorage.getItem(HKEY_DEPO); return raw?JSON.parse(raw).map(r=>({...r,date:new Date(r.date)})):[]; }catch(e){ return []; } }
// Kunci tanggal (YYYY-MM-DD) berbasis kalender lokal perangkat, dipakai untuk batas H-1 tab Depo.
const ymdLocal = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ymdUTC = d => d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
function yesterdayKey(){ const n=new Date(); const y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1); return ymdLocal(y); }
// Baris "utama" tab aktif (dipakai untuk daftar periode & cek kosong/tidaknya data).
function primaryRows(){ return currentTab==='depo' ? curRowsBase('h') : allRows; }
// Baris mentah (semua bulan, sebelum filter periode) untuk sumber src ('p'/'h') pada tab aktif.
// Tab Depo dibatasi maksimal H-1 (hari ini tidak ikut ditampilkan, karena datanya biasanya belum final).
function curRowsBase(src){
  if(currentTab==='depo'){
    if(src==='p') return [];
    const yk=yesterdayKey();
    return hRowsDepo.filter(r=>ymdUTC(r.date)<=yk);
  }
  return src==='p' ? allRows : hRows;
}
// SPEC yang berlaku utk tab aktif: tab Depo tidak pakai pilihan kriteria — cuma 1 kriteria
// "Aktivitas" dengan 1 tabel berisi kolom-kolom tertentu saja (lihat SPEC_DEPO).

function colNameToNum(s){let n=0;for(const ch of s.toUpperCase())n=n*26+ch.charCodeAt(0)-64;return n-1;}
function cellToNum(v){ if(v instanceof Date) return v; if(typeof v==='number') return v; if(v==null||v==='') return 0; const n=Number(String(v).replace(/,/g,'')); return Number.isFinite(n)?n:0; }
function findTokoColumn(rows, headerIdx){
  // Cari header TOKO/STORE secara fleksibel di sekitar baris header.
  for(let rr=Math.max(0,headerIdx-3); rr<=Math.min(rows.length-1,headerIdx+2); rr++){
    const row=rows[rr]||[];
    for(let c=0;c<row.length;c++){
      const s=N(row[c]);
      if(/^(KODE\s*)?(TOKO|STORE)$/.test(s) || /\bTOKO\b/.test(s) || /\bSTORE\b/.test(s)) return c;
    }
  }
  return null;
}

// SheetJS membaca hasil cache formula Excel. Pada sejumlah file, cache-nya 0
// walaupun formula-nya ada. Evaluator ringan ini menghitung ulang formula umum
// langsung di browser sehingga nilai formula tidak otomatis menjadi 0.
function makeFormulaEvaluator(wb){
  const cache=new Map(), busy=new Set();
  const addrRe=/^([A-Z]{1,3})(\d+)$/i;
  const norm=v=>v==null?'':v;
  function sheet(name){ return wb.Sheets[name]; }
  function raw(ws,addr){ return ws && ws[addr] ? ws[addr] : null; }
  function val(ws,addr){
    const key=(wb.SheetNames.find(n=>wb.Sheets[n]===ws)||'')+'!'+addr.toUpperCase();
    if(cache.has(key)) return cache.get(key);
    if(busy.has(key)) return 0;
    const cell=raw(ws,addr); if(!cell){cache.set(key,0);return 0;}
    if(!cell.f){ const v=cell.v; const out=typeof v==='number'?v:(v instanceof Date?v:cellToNum(v)); cache.set(key,out); return out; }
    busy.add(key);
    let out=0;
    try{ out=evalFormula(ws,cell.f,addr); if(!Number.isFinite(Number(out))) out=0; }catch(e){ out=typeof cell.v==='number' && cell.v!==0 ? cell.v : 0; }
    busy.delete(key); cache.set(key,out); return out;
  }
  function range(ws,a,b){
    const ma=a.match(addrRe), mb=b.match(addrRe); if(!ma||!mb)return [];
    const c1=colNameToNum(ma[1]), c2=colNameToNum(mb[1]), r1=+ma[2], r2=+mb[2], out=[];
    for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++) for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++){
      let n=c, letters=''; do{letters=String.fromCharCode(65+n%26)+letters;n=Math.floor(n/26)-1;}while(n>=0);
      out.push(val(ws,letters+(r)));
    } return out;
  }
  function evalFormula(ws,f,curAddr){
    let x=String(f).replace(/^=/,'').replace(/;/g,',').replace(/\^/g,'**');
    x=x.replace(/\bTRUE\b/gi,'true').replace(/\bFALSE\b/gi,'false');
    // Sheet references: 'Nama Sheet'!A1 / NamaSheet!A1
    x=x.replace(/(?:'([^']+)'|([A-Za-z_][A-Za-z0-9_. ]*))!\$?([A-Z]{1,3})\$?(\d+)/g,(m,q1,q2,c,r)=>`S(${JSON.stringify(q1||q2)},"${c}${r}")`);
    x=x.replace(/\$?([A-Z]{1,3})\$?(\d+)\s*:\s*\$?([A-Z]{1,3})\$?(\d+)/g,(m,c1,r1,c2,r2)=>`R("${c1}${r1}:${c2}${r2}")`);
    x=x.replace(/\$?([A-Z]{1,3})\$?(\d+)/g,(m,c,r)=>`V("${c}${r}")`);
    const V=a=>val(ws,a), R=rg=>{const [a,b]=rg.split(':');return range(ws,a,b)}, S=(sn,a)=>{const sh=sheet(sn);return sh?val(sh,a):0};
    const FLAT=a=>Array.isArray(a)?a.flat(Infinity):[a];
    const SUM=a=>FLAT(a).reduce((s,v)=>s+(Number(v)||0),0);
    const AVG=a=>{const z=FLAT(a).map(Number).filter(Number.isFinite);return z.length?z.reduce((s,v)=>s+v,0)/z.length:0};
    const COUNT=a=>FLAT(a).filter(v=>typeof v==='number'&&Number.isFinite(v)).length;
    const MIN=a=>{const z=FLAT(a).map(Number).filter(Number.isFinite);return z.length?Math.min(...z):0};
    const MAX=a=>{const z=FLAT(a).map(Number).filter(Number.isFinite);return z.length?Math.max(...z):0};
    const IF=(c,a,b)=>c?a:b, IFERROR=(a,b)=>{try{return a}catch(e){return b}};
    const ROUND=(a,n=0)=>{const p=10**Number(n||0);return Math.round(Number(a)*p)/p};
    const ROUNDUP=(a,n=0)=>{const p=10**Number(n||0);return Math.ceil(Number(a)*p)/p};
    const ROUNDDOWN=(a,n=0)=>{const p=10**Number(n||0);return Math.floor(Number(a)*p)/p};
    const MOD=(a,b)=>Number(a)%Number(b), ABS=Math.abs, INT=Math.trunc;
    return Function('V','R','S','SUM','AVERAGE','AVG','COUNT','MIN','MAX','IF','IFERROR','ROUND','ROUNDUP','ROUNDDOWN','MOD','ABS','INT',`"use strict"; return (${x});`)(V,R,S,SUM,AVG,AVG,COUNT,MIN,MAX,IF,IFERROR,ROUND,ROUNDUP,ROUNDDOWN,MOD,ABS,INT);
  }
  return {value:val, formula:(ws,addr)=>{const c=raw(ws,addr);return c&&c.f?evalFormula(ws,c.f,addr):cellToNum(c&&c.v);}};
}

const MON={jan:0,feb:1,mar:2,apr:3,mei:4,jun:5,jul:6,aug:7,agu:7,sep:8,okt:9,nov:10,des:11};

function parseWorkbook(wb){
  // Struktur workbook: setiap "Produktivitas Nasional XXX" berpasangan
  // dengan "Laporan Harian XXX". Tanggal dan JML TOKO berasal dari
  // Laporan Harian, sedangkan seluruh metrik produktivitas berasal dari
  // Produktivitas Nasional.
  const prodSheets = wb.SheetNames.filter(n => /^produktivitas nasional/i.test(n.trim()));
  const dailyBySuffix = new Map();
  wb.SheetNames.filter(n => /^laporan harian/i.test(n.trim())).forEach(n=>{
    const suffix = n.replace(/^laporan harian/i,'').trim().toUpperCase();
    dailyBySuffix.set(suffix,n);
  });

  const out=[];
  for(const name of prodSheets){
    const suffix=name.replace(/^produktivitas nasional/i,'').trim().toUpperCase();
    // Bulan yang "seharusnya" untuk sheet ini ditentukan dari nama sheet-nya sendiri (mis. "...JAN" -> Januari),
    // bukan dari baris pertama yang berhasil dibaca — supaya kalau baris pertama kebetulan rusak/nyasar,
    // sheet ini tidak ikut salah dan bulan berjalan (yang datanya baru sebagian) tidak hilang seluruhnya.
    const expectedMonth = MON[suffix.slice(0,3).toLowerCase()];
    // Fokus data 2026; Des 25 tetap diabaikan karena bukan periode laporan 2026.
    const ws=wb.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,cellDates:true,defval:null});
    let headerIdx=-1;
    for(let i=0;i<rows.length;i++){
      if(N(rows[i]?.[1])==='TGL' && N(rows[i]?.[2])==='NPB ALL'){ headerIdx=i; break; }
    }
    if(headerIdx<0) continue;

    // Ambil Tanggal dan JML TOKO dari Laporan Harian pasangan sheet.
    const dailyName=dailyBySuffix.get(suffix);
    const tokoByDay=new Map();
    if(dailyName){
      const dws=wb.Sheets[dailyName];
      const drows=XLSX.utils.sheet_to_json(dws,{header:1,raw:true,cellDates:true,defval:null});
      let dhead=-1;
      for(let i=0;i<drows.length;i++){
        if(N(drows[i]?.[1])==='TGL' && N(drows[i]?.[2])==='JML TOKO'){ dhead=i; break; }
      }
      if(dhead>=0){
        for(let i=dhead+1;i<drows.length;i++){
          const day=Number(drows[i]?.[1]);
          if(!Number.isFinite(day) || day<1 || day>31) continue;
          const toko=drows[i]?.[2];
          if(toko!==null && toko!==undefined && toko!=='') tokoByDay.set(day,cellToNum(toko));
        }
      }
    }

    // Hitung ulang formula langsung dari data terbaru di sheet (bukan cached value
    // lama Excel), supaya kolom AKM/akumulasi dsb selalu mengikuti data yang diinput.
    // Kalau evaluasi formula gagal/tidak tersedia, baru jatuh ke cached value Excel.
    const ev = makeFormulaEvaluator(wb);
    const get=(r,c)=>{
      const addr=XLSX.utils.encode_cell({r,c});
      try{ const v=ev.value(ws,addr); if(v!=null && v!=='') return v; }catch(e){}
      const cell=ws[addr];
      if(cell && cell.v!==undefined && cell.v!==null && cell.v!=='') return cell.v;
      return cellToNum(rows[r]?.[c]);
    };

    let sheetMonth=expectedMonth ?? null; // fallback: kalau nama sheet tidak dikenali sbg bulan, pakai bulan baris valid pertama
    for(let i=headerIdx;i<rows.length;i++){
      const r=rows[i]; if(!r) continue;
      // Untuk sel tanggal yang merupakan formula (mis. =+B7+1), sheet_to_json
      // mengembalikan teks formula. Ambil cached value langsung dari worksheet.
      const dateCell=ws[XLSX.utils.encode_cell({r:i,c:1})];
      // Lewati baris bantu seperti "=TODAY()-1" (dipakai untuk monitoring harian via
      // referensi file eksternal) — ini bukan baris tanggal 1..akhir bulan yang sesungguhnya,
      // dan kalau ikut terbaca akan menimpa data tanggal asli dengan data yang sebagian kosong.
      if(dateCell && dateCell.f && /TODAY\s*\(/i.test(dateCell.f)) continue;
      let rawDate=dateCell && dateCell.v!==undefined ? dateCell.v : r[1];
      if(!(rawDate instanceof Date)) continue;
      // Bulatkan ke hari UTC terdekat (bukan dikonstruksi ulang lewat Date lokal — itu yang kemarin
      // bikin tanggal geser mundur 1 hari saat disinkron ke Google Sheets via toISOString). Pembulatan
      // ini hanya menghapus sisa desimal kecil akibat formula (mis. =+B7+1), tanpa mengubah zona waktu.
      const DAY_MS=86400000;
      rawDate=new Date(Math.round(rawDate.getTime()/DAY_MS)*DAY_MS);
      const year=rawDate.getUTCFullYear();
      if(year!==2026) continue;
      const month=rawDate.getUTCMonth();
      if(sheetMonth===null) sheetMonth=month;
      // Baris yang bulannya beda dari bulan sheet ini dilewati SATU-SATU (bukan menghentikan seluruh
      // sheet) — supaya satu baris yang nyasar tidak ikut menghapus sisa data bulan berjalan yang
      // sebetulnya masih valid setelahnya.
      if(month!==sheetMonth) continue;
      const day=rawDate.getUTCDate();
      if(!(cellToNum(get(i,2))>0)) continue; // hari yang belum terisi (baris kosong akhir bulan) dilewati
      out.push({
        date:rawDate,
        toko:tokoByDay.get(day) ?? null,
        npbAll:get(i,2), akmNpb:get(i,3), jamLembur:get(i,4), pengaliLembur:get(i,5),
        umr:get(i,6), konversiRp:get(i,7), konversiOrang:get(i,8), jmlKaryawan:get(i,9), prodAkm:get(i,10),
        npbDry:get(i,13), akmNpbWh:get(i,14), jamLemburWh:get(i,15), pengaliLemburWh:get(i,16), umrWh:get(i,17),
        konversiRpWh:get(i,18), konversiOrangWh:get(i,19), jmlKaryawanWh:get(i,20), prodAkmWh:get(i,21)
      });
    }
  }
  out.sort((a,b)=>a.date-b.date);
  // buang duplikat tanggal (mis. baris ringkasan di bawah tabel) — ambil yang pertama
  const seen=new Set();
  return out.filter(r=>{const k=fmtMonthKey(r.date)+'-'+r.date.getDate(); if(seen.has(k)) return false; seen.add(k); return true;});
}

function toJSONRows(rows){
  return (rows||[]).map(r=>({...r,date:r.date instanceof Date?r.date.toISOString():r.date}));
}
function fromJSONRows(rows){
  return (rows||[]).map(r=>({...r,date:new Date(r.date)}));
}
function saveLocal(rows){
  try{ localStorage.setItem('prod_dashboard_data', JSON.stringify(toJSONRows(rows))); }
  catch(e){ console.warn('Storage lokal gagal', e); }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem('prod_dashboard_data');
    return raw ? fromJSONRows(JSON.parse(raw)) : null;
  }catch(e){ return null; }
}

async function googleRequest(method='GET', payload=null){
  if(!USE_GOOGLE_SHEETS) throw new Error('URL Google Apps Script belum dipasang.');
  const opt={method, redirect:'follow', cache:'no-store'};
  if(payload){ opt.headers={'Content-Type':'text/plain;charset=utf-8'}; opt.body=JSON.stringify(payload); }
  const res=await fetch(APPS_SCRIPT_URL,opt);
  const text=await res.text();
  let data; try{ data=JSON.parse(text); }catch(e){ throw new Error('Respons server tidak valid. Pastikan URL Web App berakhiran /exec.'); }
  if(!res.ok || data.ok===false) throw new Error(data.error||('HTTP '+res.status));
  return data;
}

async function loadFromGoogle(){
  if(!USE_GOOGLE_SHEETS) return false;
  setSyncLine('Menyinkronkan…');
  try{
    const data=await googleRequest('GET');
    allRows=fromJSONRows(data.productivity||[]);
    hRows=fromJSONRows(data.daily||[]);
    hRowsDepo=fromJSONRows(data.dailyDepo||[]);
    if(!allRows.length && !hRowsDepo.length){ setSyncLine('Google Sheets belum memiliki data.'); render(); return false; }
    saveLocal(allRows); saveH(hRows); saveHDepo(hRowsDepo);
    activeMonth=latestMonthKey(primaryRows()); render();
    setSyncLine(`Tersinkron · ${data.updatedAt?new Date(data.updatedAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}): 'baru saja'}`);
    return true;
  }catch(err){
    console.warn('Google Sheets gagal:',err);
    setSyncLine('Offline · Data lokal');
    render();
    return false;
  }
}

async function syncToGoogle(showAlert=true){
  if(!USE_GOOGLE_SHEETS){
    if(showAlert) alert('Pasang APPS_SCRIPT_URL terlebih dahulu di index.html.');
    return false;
  }
  if(!allRows.length && !hRowsDepo.length){ if(showAlert) alert('Belum ada data untuk disinkronkan.'); return false; }
  const btn=$('#sync-btn'); if(btn) {btn.disabled=true; btn.textContent='↻ Menyimpan…';}
  setSyncLine('Menyinkronkan…');
  try{
    const data=await googleRequest('POST',{
      action:'save',
      productivity:toJSONRows(allRows),
      daily:toJSONRows(hRows),
      dailyDepo:toJSONRows(hRowsDepo)
    });
    setSyncLine(`Tersinkron · ${data.updatedAt?new Date(data.updatedAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'baru saja'}`);
    if(showAlert) alert('Data berhasil disimpan ke Google Sheets.');
    return true;
  }catch(err){
    setSyncLine('Gagal sinkron');
    if(showAlert) alert('Gagal menyimpan ke Google Sheets: '+err.message);
    return false;
  }finally{ if(btn){btn.disabled=false;btn.textContent='↻ Sinkron Ulang';} }
}

// Sheet "Laporan Harian <bulan>": kolom dicari lewat nama header (susunan kolom ekor berbeda antar bulan)
function parseHarian(wb){
  const MON={jan:0,feb:1,mar:2,apr:3,mei:4,jun:5,jul:6,aug:7,agu:7,sep:8,okt:9,nov:10,des:11}, out=[];
  const items=SPEC.filter(g=>g.src==='h').flatMap(g=>g.subs.flatMap(s=>s.items));
  for(const name of wb.SheetNames){
    const m=/^laporan harian\s+(\S+)/i.exec(name.trim()); if(!m) continue;
    const mi=MON[m[1].slice(0,3).toLowerCase()], yr=/25$/.test(name.trim())?2025:2026;
    if(mi==null||yr<2026) continue;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    const h=rows.findIndex(r=>r&&r[1]==='TGL'); if(h<0) continue;
    const lab={}; let g='';
    const w=Math.max(0,...rows.slice(h,h+3).map(r=>r?r.length:0));
    for(let c=2;c<w;c++){ if(rows[h+1]&&rows[h+1][c]!=null) g=N(rows[h+1][c]); lab[g+'|'+N(rows[h+2]&&rows[h+2][c])]=c; }
    const cols=items.map(i=>[i.k,i.t,[i.k,...(i.a||[])].map(x=>lab[x]).find(x=>x!=null)]);
    const cNpb=lab['NPB ALL|HARIAN']; if(cNpb==null) continue;
    for(let i=h+1;i<rows.length;i++){
      const r=rows[i];
      if(!r||typeof r[1]!=='number'||r[1]<1||r[1]>31) continue;
      const d=new Date(yr,mi,r[1]); if(d.getMonth()!==mi||typeof r[cNpb]!=='number') continue;
      const o={date:d, toko:typeof r[2]==='number'?r[2]:null};
      for(const [k,t,c] of cols){
        let v=c==null?null:r[c];
        if(typeof v!=='number') v=null;
        else if(t==='h'){ v=(v%1)*24; v=v===0?null:(v<8?v+24:v); }
        else if(t==='m'){ v=v*1440; }
        o[k]=v;
      }
      out.push(o);
    }
  }
  return out.sort((a,b)=>a.date-b.date);
}

function loadH(){ try{ const raw=localStorage.getItem(HKEY); return raw?JSON.parse(raw).map(r=>({...r,date:new Date(r.date)})):[]; }catch(e){ return []; } }

// File "Depo": satu sheet per lokasi (mis. "IGR BGR1"), struktur header sama dengan
// Laporan Harian (TGL/JML TOKO di baris header, lalu GRUP di baris berikutnya, lalu SUB
// di baris setelahnya), tapi mencakup banyak bulan sekaligus dalam satu sheet, dan tidak
// selalu diawali nama "Laporan Harian <bulan>" — jadi semua sheet di workbook dicoba.
// Kolom yang memang tidak ada di file ini otomatis bernilai null (dan disembunyikan saat
// render, lihat tablePanel/chartTabsFor).
function parseDepoHarian(wb){
  const items=SPEC.filter(g=>g.src==='h').flatMap(g=>g.subs.flatMap(s=>s.items));
  const out=[];
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,cellDates:true,defval:null});
    let h=-1;
    for(let i=0;i<rows.length;i++){
      if(N(rows[i]?.[1])==='TGL' && /TOKO/.test(N(rows[i]?.[2]))){ h=i; break; }
    }
    if(h<0) continue;
    const lab={}; let g='';
    const w=Math.max(0,...rows.slice(h,h+3).map(r=>r?r.length:0));
    for(let c=2;c<w;c++){ if(rows[h+1]&&rows[h+1][c]!=null) g=N(rows[h+1][c]); lab[g+'|'+N(rows[h+2]&&rows[h+2][c])]=c; }
    const cols=items.map(i=>[i.k,i.t,[i.k,...(i.a||[])].map(x=>lab[x]).find(x=>x!=null)]);
    for(let i=h+1;i<rows.length;i++){
      const r=rows[i]; if(!r) continue;
      const dateCell=ws[XLSX.utils.encode_cell({r:i,c:1})];
      let rawDate=dateCell && dateCell.v!==undefined ? dateCell.v : r[1];
      if(!(rawDate instanceof Date)) continue;
      const DAY_MS=86400000;
      rawDate=new Date(Math.round(rawDate.getTime()/DAY_MS)*DAY_MS);
      const o={date:rawDate, toko: typeof r[2]==='number'?r[2]:null};
      for(const [k,t,c] of cols){
        let v=c==null?null:r[c];
        if(typeof v!=='number') v=null;
        else if(t==='h'){ v=(v%1)*24; v=v===0?null:(v<8?v+24:v); }
        else if(t==='m'){ v=v*1440; }
        o[k]=v;
      }
      out.push(o);
    }
  }
  out.sort((a,b)=>a.date-b.date);
  const seen=new Set();
  return out.filter(r=>{const k=fmtMonthKey(r.date)+'-'+r.date.getDate(); if(seen.has(k)) return false; seen.add(k); return true;});
}

const fmtC = v => Math.abs(v)>=1e6 ? new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:1}).format(v) : new Intl.NumberFormat('id-ID',{maximumFractionDigits:1}).format(v);
const fmtFull = v => new Intl.NumberFormat('id-ID',{maximumFractionDigits:Math.abs(v)<1000?2:0}).format(v);

const valLabels = {id:'valLabels', afterDatasetsDraw(ch){
  const ctx = ch.ctx;
  ch.data.datasets.forEach((ds,i)=>ch.getDatasetMeta(i).data.forEach((pt,j)=>{
    const v = ds.data[j]; if(v==null || isNaN(pt.y)) return;
    ctx.save(); ctx.fillStyle='#14213D'; ctx.font='10px JetBrains Mono, monospace'; ctx.textAlign='center';
    ctx.fillText(fmtC(v), pt.x, pt.y + (i%2 ? 16+Math.floor(i/2)*13 : -8-Math.floor(i/2)*13)); ctx.restore();
  }));
}};
const pad2 = n => String(n).padStart(2,'0');
function fmtCell(v, kind){
  if(kind==='h'){ const t = Math.round(v*60); return pad2(Math.floor(t/60)%24)+':'+pad2(t%60); }
  if(kind==='m'){ const t = Math.round(v*60); return Math.floor(t/60)+':'+pad2(t%60); }
  return fmtFull(v);
}

function extraKpiHtml(){

  const last = hr[hr.length-1];
  const num = k => typeof last[k]==='number' ? last[k] : null;
  const v = (k,t) => last[k]==null ? '-' : fmtCell(last[k], t);
  const fmt = n => n==null ? '-' : fmtFull(n);
  const avg = (k,t) => { const z=hr.map(r=>r[k]).filter(x=>typeof x==='number'); if(!z.length) return '-'; const m=z.reduce((a,b)=>a+b,0)/z.length; return t ? fmtCell(m,t) : fmtFull(m); };
  const total = (k,t) => { const z=hr.map(r=>r[k]).filter(x=>typeof x==='number'); if(!z.length) return '-'; const n=z.reduce((a,b)=>a+b,0); return t ? fmtCell(n,t) : fmtFull(n); };
  // NKL: Budget Point dihitung dari Akm. NPB Dry sesuai persentase yang diminta.
  const akmNpbDry = num('NPB DRY|AKUMULASI');
  const budgetPoint100 = akmNpbDry==null ? null : akmNpbDry*0.0001;
  const budgetPoint75  = akmNpbDry==null ? null : akmNpbDry*0.0002;
  const budgetPoint50  = akmNpbDry==null ? null : akmNpbDry*0.00025;
  const totalNkl = num('NKL DRY|TOTAL NKL'), ba = num('NKL DRY|BA');

// Tab grafik: sub.charts (bila ada) mendefinisikan tab gabungan (multi-seri) secara eksplisit;
// kalau tidak ada, jatuh ke perilaku lama: satu tab per kolom, kecuali kolom ditandai chart:false.
// fullRows = seluruh baris sumber (semua bulan, tanpa filter periode) — dipakai untuk menentukan
// kolom mana yang benar-benar tidak pernah terisi di file yang sedang aktif, supaya kolom itu
// disembunyikan sepenuhnya (bukan cuma ditampilkan '-').
// fullRows = seluruh baris sumber (semua bulan, tanpa filter periode) — dipakai untuk menentukan
// kolom mana yang benar-benar tidak pernah terisi di file yang sedang aktif, supaya kolom itu
// disembunyikan sepenuhnya (bukan cuma ditampilkan '-'). Khusus tab Depo, kolom yang seluruh
// nilainya 0 (tidak ada trend sama sekali) ikut disembunyikan juga.
function hasRealData_(k, fullRows){
  if(!fullRows) return true;
  const zeroSkip = currentTab==='depo';
  return fullRows.some(r=>{ const v=r[k]; if(v==null) return false; if(zeroSkip && v===0) return false; return true; });
}
function chartTabsFor(s, fullRows){
  const has = k => hasRealData_(k, fullRows);
  if(s.charts) return s.charts.map(c=>({...c, keys:c.keys.filter(has)})).filter(c=>c.keys.length);
  const items = s.items.filter(i=>i.chart!==false && has(i.k));
  const names = tabLabels(items);
  return items.map((it,i)=>({label:names[i], keys:[it.k]}));
}

function tablePanel(g, s, si, rows){
  const fullRows = curRowsBase(g.src);
  const visibleItems = s.items.filter(i=>hasRealData_(i.k, fullRows));
  const items = visibleItems.length ? visibleItems : s.items; // jaga-jaga, jangan sampai tabel jadi kosong total
  const showToko = s.n==='LPP' || s.toko===true;
  const tokoLabel = s.tokoLabel || 'Toko';
  const th = items.map(i=>`<th>${esc(i.l)}</th>`).join('');
  const body = rows.map(r=>`<tr><td>${r.date.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}</td>`+
    (showToko?`<td class="mono">${r.toko!=null?fmtFull(r.toko):'-'}</td>`:'')+
    items.map(i=>{const v=r[i.k]; return `<td class="mono">${v==null?'-':fmtCell(v,i.t)}</td>`;}).join('')+'</tr>').join('');
  const avgSubs = new Set(['LPP','NPB dan BPB','TIME PICKING','PICKING dan KIRIM','UTILITAS','ARMADA','JAM SELESAI OPERASIONAL','KEHADIRAN ALL KARY']);
  const totalSubs = new Set(['BARANG TERTINGGAL','JAM LEMBUR']);
  // Agregasi per-item: item boleh punya "agg":'sum'/'avg' sendiri (dipakai tab Depo, campuran
  // dijumlah utk NPB & Jam Lembur, sisanya dirata-rata); kalau tidak ada, jatuh ke default sub
  // (s.defaultAgg) atau ke aturan lama per-nama-sub (avgSubs/totalSubs). Semua digabung jadi
  // 1 baris ringkasan saja (kolom Jml Toko ikut dirata-rata bila ditampilkan).
  const aggOf = i => i.agg || s.defaultAgg || (avgSubs.has(s.n) ? 'avg' : totalSubs.has(s.n) ? 'sum' : null);
  const kindsPresent = new Set(items.map(aggOf).filter(Boolean));
  let summaryRow = '';
  if(rows.length && kindsPresent.size){
    const label = kindsPresent.size>1 ? 'Ringkasan' : (kindsPresent.has('sum') ? 'Total' : 'Avg');
    const tokoCell = !showToko ? '' : (()=>{
      const z=rows.map(r=>r.toko).filter(x=>typeof x==='number');
      return `<td class="mono">${z.length?fmtFull(z.reduce((a,b)=>a+b,0)/z.length):'-'}</td>`;
    })();
    summaryRow = `<tr class="summary-row"><td>${label}</td>${tokoCell}`+
      items.map(i=>{
        const kind=aggOf(i);
        if(!kind) return '<td class="mono">-</td>';
        const z=rows.map(r=>r[i.k]).filter(x=>typeof x==='number');
        if(!z.length) return '<td class="mono">-</td>';
        const n=kind==='avg' ? z.reduce((a,b)=>a+b,0)/z.length : z.reduce((a,b)=>a+b,0);
        return `<td class="mono">${fmtCell(n,i.t)}</td>`;
      }).join('')+`</tr>`;
  }
  const info = rows.length ? `${rows.length} hari · ${fmtDate(rows[0].date)} – ${fmtDate(rows[rows.length-1].date)}` : 'Belum ada data';
  const hasCharts = chartTabsFor(s, fullRows).length>0;
  const colspan = items.length + (showToko?2:1);
  return `<div class="panel"><h3>${g.flat?esc(g.n):esc(g.n)+' · '+esc(s.n)}</h3><div class="legend">${dot(g.color,g.n)}<span>${info}</span></div>`+
    `<div class="tbl-wrap"><table><thead><tr><th>Tanggal</th>${showToko?`<th>${esc(tokoLabel)}</th>`:''}${th}</tr></thead><tbody>${body||'<tr><td colspan="'+colspan+'">Belum ada data.</td></tr>'}${summaryRow}</tbody></table></div>`+
    (rows.length && hasCharts?`<details class="cd" data-si="${si}"><summary>Grafik</summary><div class="cbox"></div></details>`:'')+`</div>`;
}

// label tab unik: kolom bernama sama (mis. "Akumulasi") diberi awalan kolom sebelumnya
function tabLabels(items){
  const cnt={}; items.forEach(i=>cnt[i.l]=(cnt[i.l]||0)+1);
  return items.map((it,i)=>{ if(cnt[it.l]<2) return it.l; for(let j=i-1;j>=0;j--) if(items[j].l!==it.l) return items[j].l+' · '+it.l; return it.l; });
}
function renderCrit(){
  const spec=specFor();
  spec.forEach((g,i)=>g.color=TCOL[i%TCOL.length]);
  renderSide();
  if(view.dash){ renderDash(); return; }
  const g=spec[view.g], subs=subsOf(view), rows=rowsFor(g.src);
  $('#view-title').textContent = g.n + (g.flat ? '' : view.s==null ? ' · semua sub kriteria' : ' › '+g.subs[view.s].n);
  if(g.src==='h' && !curRowsBase('h').length){
    $('#tables').innerHTML='<div class="note">Data Laporan Harian (operasional, inventory, karyawan, utilitas, armada) belum dimuat di perangkat ini — upload ulang file .xlsx untuk memuatnya.</div>';
    return;
  }
  $('#tables').innerHTML = subs.map((s,si)=>tablePanel(g,s,si,rows)).join('');
  document.querySelectorAll('#tables details.cd').forEach(d=>d.addEventListener('toggle',()=>{
    if(!d.open||d.dataset.done) return; d.dataset.done='1';
    const s=subs[+d.dataset.si], box=d.querySelector('.cbox');
    const tabs=chartTabsFor(s, curRowsBase(g.src)), lb=rows.map(x=>fmtDate(x.date));
    box.innerHTML=`<div class="tabs">${tabs.map((t,k)=>`<button type="button" class="tab${k?'':' on'}" data-k="${k}">${esc(t.label)}</button>`).join('')}</div>`+
      `<div class="tab-body"><div class="cw" style="width:${Math.max(rows.length*54,640)}px"><canvas></canvas></div></div>`;
    let cur=null;
    const show=k=>{
      if(cur){ cur.destroy(); hCharts=hCharts.filter(c=>c!==cur); }
      const t=tabs[k], multi=t.keys.length>1;
      const series=t.keys.map((key,idx)=>{
        const it=s.items.find(x=>x.k===key);
        const label = multi ? ((t.labels && t.labels[idx]) || (it?it.l:key)) : t.label;
        return {label, data:rows.map(x=>x[key]==null?null:x[key]), color: multi ? MCOL[idx%MCOL.length] : g.color};
      });
      cur=critChart(box.querySelector('canvas'), lb, series);
      hCharts.push(cur);
      box.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
    };
    box.querySelector('.tabs').onclick=e=>{ const t=e.target.closest('.tab'); if(t) show(+t.dataset.k); };
    show(0);
  }));
}

function setSyncLine(text){
  const el=$('#syncline');
  el.className='sub';
  if(!text){ el.textContent=''; return; }
  if(text.startsWith('Tersinkron')) el.classList.add('sync-ok');
  else if(text.startsWith('Menyinkronkan')) el.classList.add('sync-loading');
  else if(text.startsWith('Offline')) el.classList.add('sync-offline');
  else if(text.startsWith('Belum tersambung')) el.classList.add('sync-unconfigured');
  else if(text.startsWith('Gagal sinkron')) {
    el.classList.add('sync-error');
    el.innerHTML='<svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1.8 20.5c-.4.7.1 1.5.9 1.5h18.6c.8 0 1.3-.8.9-1.5L12 3zm1 13h-2v2h2v-2zm0-7h-2v5h2V9z"/></svg><span>Gagal sinkron, Coba lagi…</span>';
    return;
  }
  el.textContent=text;
}

function setUploadBusy(busy){
  [$('#upload-btn'), $('#upload-btn-2'), $('#hidden-input')].forEach(el=>{
    if(!el) return;
    el.disabled = busy;
    el.style.pointerEvents = busy ? 'none' : '';
    el.style.opacity = busy ? '.55' : '';
  });
  const b2=$('#upload-btn-2');
  if(b2) b2.textContent = busy ? 'Memuat…' : 'Pilih file .xlsx';
}

function handleFile(file){
  setUploadBusy(true);
  const reader = new FileReader();
  reader.onload = async e => {
    try{
      if(currentTab==='depo'){
        const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
        const rows = parseDepoHarian(wb);
        if(!rows.length){ alert('Sheet Laporan Harian (format TGL/JML TOKO) tidak ditemukan atau kosong di file IGR Sukabumi ini.'); return; }
        hRowsDepo = rows; activeMonth = latestMonthKey(curRowsBase('h'));
        saveHDepo(hRowsDepo); render();
        await syncToGoogle(false);
      } else {
        const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
        const rows = parseWorkbook(wb);
        if(!rows.length){ alert('Sheet "Produktivitas Nasional" (mulai Jan 2026) tidak ditemukan atau kosong di file ini.'); return; }
        allRows = rows; activeMonth = latestMonthKey(allRows);
        hRows = parseHarian(XLSX.read(e.target.result,{type:'array'}));
        saveH(hRows); saveLocal(allRows); render();
        // Upload tetap langsung tampil; sinkronisasi berjalan setelah parsing selesai.
        await syncToGoogle(false);
      }
    }catch(err){ alert('Gagal membaca file: ' + err.message); }
    finally{ setUploadBusy(false); }
  };
  reader.onerror = () => setUploadBusy(false);
  reader.readAsArrayBuffer(file);
}

async function initLocal(){
  setUploadBusy(true);
  try{
    hRowsDepo = loadHDepo();
    if(USE_GOOGLE_SHEETS){
      $('#sync-btn').style.display='inline-block';
      const ok=await loadFromGoogle();
      if(ok) return;
    }
    const local = loadLocal();
    if(local && local.length){
      allRows = local; hRows = loadH(); activeMonth = latestMonthKey(allRows);
    }
    render();
    if(!USE_GOOGLE_SHEETS){
      setSyncLine(primaryRows().length ? 'Belum tersambung' : '');
    } else if(!(local && local.length)){
      setSyncLine(hRowsDepo.length ? 'Offline · Data lokal' : '');
    } else {
      setSyncLine('Offline · Data lokal');
    }
  } finally { setUploadBusy(false); }
}

$('#upload-btn').onclick = () => { $('#hidden-input').click(); $('#action-menu').classList.remove('open'); };
$('#upload-btn-2').onclick = () => $('#hidden-input').click();
$('#sync-btn').onclick = () => loadFromGoogle();
$('#hidden-input').onchange = e => { if(e.target.files[0]) handleFile(e.target.files[0]); };

const ACCESS_CODE = 'G113';
function withAccessCode(action){
  $('#action-menu').classList.remove('open');
  const code = prompt('Masukkan kode akses:');
  if(code === null) return;
  if(code.trim().toUpperCase() !== ACCESS_CODE){ alert('Kode akses salah.'); return; }
  action();
}

$('#db-btn').onclick = () => withAccessCode(() => {
  window.open('https://docs.google.com/spreadsheets/d/1A2XrFfbRbKBwoZC2Z-AWiwTUt39YecpgoBBI6rBaX6Q/edit?gid=1613560084#gid=1613560084', '_blank');
});

$('#clear-btn').onclick = () => withAccessCode(() => {
  const label = currentTab==='depo' ? 'tab IGR Sukabumi' : 'tab DC Bogor 1';
  if(!confirm(`Hapus data ${label} yang tersimpan di perangkat ini?`)) return;
  try{
    if(currentTab==='depo'){
      localStorage.removeItem(HKEY_DEPO);
      hRowsDepo = [];
    } else {
      localStorage.removeItem('prod_dashboard_data'); localStorage.removeItem('prod_dashboard_harian'); localStorage.removeItem(HKEY);
      hRows = []; allRows = [];
    }
  }catch(e){}
  render();
  setSyncLine('');
});

// Tab sumber data (Induk / Depo) — ganti tampilan tanpa reload halaman.
document.querySelectorAll('.src-tab').forEach(btn=>{
  btn.onclick = () => {
    const src = btn.dataset.src;
    if(src===currentTab) return;
    currentTab = src;
    document.querySelectorAll('.src-tab').forEach(x=>x.classList.toggle('active', x===btn));
    view = {dash:true};
    activeMonth = latestMonthKey(primaryRows());
    hCharts.forEach(c=>c.destroy()); hCharts=[];
    render();
  };
});

initLocal();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW gagal daftar', err));
  });
}
</script>
</body>
</html>
